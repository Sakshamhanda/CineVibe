<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVibe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="top-section">
        <!-- AppName -->
        <div id="app-name">
            <h1>CineVibe</h1>
        </div>

        <!-- searchbar -->

        <form class="search-bar">
            <div class="search-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-search" viewBox="0 0 16 16">
                    <path
                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                </svg></div>
            <input type="text" placeholder="  Search you fav. Movie....." id="input-bar" autocomplete="off">

        </form>
    </div>

    <div class="container">

        <!-- trendingsection -->
        <div class="trending-section">
            <h1>Top Trending Movies</h1>
            <div class="trending-grid">

            </div>
        </div>

        <!-- All Movies -->

        <div class="movie-section">
            <h1>LATEST MOVIES</h1>
            <div class="movie-grid">

            </div>
        </div>
    </div>
    <script type="module" src="/script.js"></script>
</body>

</html>
